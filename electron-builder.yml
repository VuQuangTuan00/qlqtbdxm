appId: vn.military.qlqtbdxm
productName: QUY TRÌNH CÔNG NGHỆ
copyright: Bộ Tư lệnh Xe Máy Quân đội

directories:
  output: dist
  buildResources: build

files:
  - main/**/*
  - renderer/**/*
  - package.json
  - '!renderer/**/*.lnk'
  - '!main/database/migrations-mssql/**'

asarUnpack:
  - node_modules/better-sqlite3/**/*

extraMetadata:
  main: main/index.js

linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: btl-xemay@military.vn

win:
  target:
    - nsis
  icon: renderer/assets/images/logo_app.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerLanguages:
    - vi-VN
  language: 1066

mac:
  target:
    - dmg
  category: public.app-category.utilities
